# zram swap: compressed swap in RAM. Used instead of zswap and a swap partition
# (the boot entries pass zswap.enabled=0).
# Goes to /etc/systemd/zram-generator.conf (copied, not linked: it is read very early at boot).
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
